<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USPSA Classifier Check</title>
<style>
  :root { --ok: #1b7f3b; --bad: #b42318; --muted: #667085; --border: #d0d5dd; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; color: #101828; background: #f9fafb; }
  main { max-width: 960px; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.5rem; margin: .5rem 0; }
  h2 { font-size: 1.15rem; margin: 1.5rem 0 .5rem; }
  .muted { color: var(--muted); font-size: .9rem; }
  .panel { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  .controls { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: center; }
  input[type=text] { font-size: 1.1rem; padding: .45rem .6rem; border: 1px solid var(--border); border-radius: 6px; width: 16rem; }
  input[type=number] { width: 4.5rem; padding: .3rem; border: 1px solid var(--border); border-radius: 6px; }
  label { white-space: nowrap; }
  .result { border-left: 4px solid var(--border); padding: .4rem .8rem; margin: .6rem 0; }
  .result.ok { border-color: var(--ok); }
  .result.bad { border-color: var(--bad); }
  .verdict { font-weight: 600; }
  .ok .verdict, td.ok { color: var(--ok); }
  .bad .verdict, td.bad { color: var(--bad); }
  ul { margin: .3rem 0; padding-left: 1.2rem; }
  li.recent { font-weight: 600; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #eaecf0; font-size: .92rem; vertical-align: top; }
  th { cursor: pointer; user-select: none; background: #f2f4f7; position: sticky; top: 0; }
  th.sorted::after { content: " \25B4"; }
  th.sorted.desc::after { content: " \25BE"; }
  a { color: #175cd3; }
  .error { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>USPSA Classifier Check</h1>
  <p class="muted">Has a classifier been shot recently by nearby clubs? Data from
    <a href="https://uspsa.org/classifiers-by-club" target="_blank" rel="noopener">uspsa.org classifiers-by-club</a>.
    <span id="generated"></span></p>

  <div class="panel">
    <div class="controls">
      <label>Classifier(s): <input id="ids" type="text" list="classifier-list" placeholder="e.g. 26-03, 99-08" autofocus></label>
      <label>Recent = last <input id="months" type="number" min="1" max="120" value="12"> months</label>
    </div>
    <div class="controls" id="clubs" style="margin-top:.6rem"></div>
    <datalist id="classifier-list"></datalist>
    <div id="results"></div>
  </div>

  <h2>All active classifiers</h2>
  <div class="controls" style="margin-bottom:.5rem">
    <label><input id="only-unshot" type="checkbox"> Only show ones not shot recently</label>
    <span id="summary" class="muted"></span>
  </div>
  <table>
    <thead><tr>
      <th data-key="id">Classifier</th>
      <th data-key="name">Name</th>
      <th data-key="last">Last shot (any club)</th>
      <th data-key="recent">Recently shot by</th>
    </tr></thead>
    <tbody id="table"></tbody>
  </table>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DATA, sortKey = "last", sortDesc = false;

function cutoff() {
  const months = Math.max(1, Number($("months").value) || 12);
  const d = new Date();
  d.setMonth(d.getMonth() - months);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
const selectedClubs = () => DATA.clubs.filter((c) => $("club-" + c.code).checked);

// id -> [{club, date, match_url}] sorted newest first, for selected clubs
function shotsById() {
  const map = new Map();
  for (const club of selectedClubs())
    for (const s of club.shots) {
      if (!map.has(s.id)) map.set(s.id, []);
      map.get(s.id).push({ club, date: s.date, match_url: s.match_url });
    }
  for (const list of map.values()) list.sort((a, b) => b.date.localeCompare(a.date));
  return map;
}

function renderResults() {
  const ids = $("ids").value.toUpperCase().split(/[\s,;]+/).filter(Boolean);
  const out = $("results");
  if (!ids.length) { out.innerHTML = ""; return; }
  const since = cutoff(), byId = shotsById();
  const names = new Map(DATA.classifiers.map((c) => [c.id, c]));
  out.innerHTML = ids.map((id) => {
    if (!/^\d{2}-\d{2}$/.test(id)) return `<div class="result"><span class="error">${esc(id)}</span>: expected a format like 26-03</div>`;
    const info = names.get(id);
    const title = info ? `${esc(id)} &ndash; ${esc(info.name)}` : `${esc(id)} <span class="muted">(not an active classifier)</span>`;
    const shots = byId.get(id) || [];
    const perClub = new Map();
    for (const s of shots) {
      if (!perClub.has(s.club.code)) perClub.set(s.club.code, []);
      perClub.get(s.club.code).push(s);
    }
    const recent = shots.some((s) => s.date >= since);
    const items = [...perClub.values()].map((list) => {
      const last = list[0], isRecent = last.date >= since;
      const more = list.length > 1 ? ` <span class="muted">(+${list.length - 1} earlier: ${list.slice(1).map((s) => s.date).join(", ")})</span>` : "";
      const date = last.match_url ? `<a href="${esc(last.match_url)}" target="_blank" rel="noopener">${last.date}</a>` : last.date;
      return `<li class="${isRecent ? "recent" : ""}">${esc(last.club.name)}: ${date}${isRecent ? " &mdash; recent" : ""}${more}</li>`;
    }).join("");
    const verdict = recent ? "Shot recently" : (shots.length ? "OK to use (not shot recently)" : "OK to use (never shot by these clubs)");
    return `<div class="result ${recent ? "bad" : "ok"}"><div>${title} &mdash; <span class="verdict">${verdict}</span></div>${items ? `<ul>${items}</ul>` : ""}</div>`;
  }).join("");
}

function renderTable() {
  const since = cutoff(), byId = shotsById();
  let rows = DATA.classifiers.map((c) => {
    const shots = byId.get(c.id) || [];
    const recentClubs = [...new Set(shots.filter((s) => s.date >= since).map((s) => s.club.code))];
    return { ...c, last: shots[0]?.date || "", lastClub: shots[0]?.club.code || "", recent: recentClubs.join(", ") };
  });
  const unshotCount = rows.filter((r) => !r.recent).length;
  $("summary").textContent = `${unshotCount} of ${rows.length} not shot since ${since}`;
  if ($("only-unshot").checked) rows = rows.filter((r) => !r.recent);
  rows.sort((a, b) => {
    const r = String(a[sortKey] ?? "").localeCompare(String(b[sortKey] ?? "")) || a.id.localeCompare(b.id);
    return sortDesc ? -r : r;
  });
  $("table").innerHTML = rows.map((r) => `<tr>
    <td><a href="#" data-id="${esc(r.id)}">${esc(r.id)}</a></td>
    <td>${r.pdf_url ? `<a href="${esc(r.pdf_url)}" target="_blank" rel="noopener">${esc(r.name)}</a>` : esc(r.name)}</td>
    <td>${r.last ? `${r.last} <span class="muted">(${esc(r.lastClub)})</span>` : '<span class="muted">never</span>'}</td>
    <td class="${r.recent ? "bad" : "ok"}">${r.recent ? esc(r.recent) : "&ndash;"}</td></tr>`).join("");
  document.querySelectorAll("th").forEach((th) => {
    th.classList.toggle("sorted", th.dataset.key === sortKey);
    th.classList.toggle("desc", th.dataset.key === sortKey && sortDesc);
  });
}

function render() { renderResults(); renderTable(); }

async function init() {
  try {
    const resp = await fetch("data.json", { cache: "no-cache" });
    if (!resp.ok) throw new Error(resp.status);
    DATA = await resp.json();
  } catch (e) {
    $("results").innerHTML = `<p class="error">Could not load data.json (${esc(e.message)}).</p>`;
    return;
  }
  $("generated").textContent = `Last updated ${new Date(DATA.generated_at).toLocaleString()}.`;
  $("classifier-list").innerHTML = DATA.classifiers.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
  $("clubs").innerHTML = "Clubs: " + DATA.clubs.map((c) =>
    `<label title="${esc(c.name)}"><input type="checkbox" id="club-${esc(c.code)}" checked> <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.code)}</a> ${esc(c.name.replace(/\s*\(\w+\)$/, ""))}</label>`).join(" ");

  const params = new URLSearchParams(location.search);
  if (params.get("ids")) $("ids").value = params.get("ids");
  if (params.get("months")) $("months").value = params.get("months");

  $("ids").addEventListener("input", () => {
    const url = new URL(location);
    $("ids").value ? url.searchParams.set("ids", $("ids").value) : url.searchParams.delete("ids");
    history.replaceState(null, "", url);
    renderResults();
  });
  $("months").addEventListener("input", render);
  $("clubs").addEventListener("change", render);
  $("only-unshot").addEventListener("change", renderTable);
  document.querySelectorAll("th").forEach((th) => th.addEventListener("click", () => {
    if (sortKey === th.dataset.key) sortDesc = !sortDesc; else { sortKey = th.dataset.key; sortDesc = false; }
    renderTable();
  }));
  $("table").addEventListener("click", (e) => {
    const id = e.target.dataset?.id;
    if (!id) return;
    e.preventDefault();
    $("ids").value = id;
    $("ids").dispatchEvent(new Event("input"));
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  render();
}
init();
</script>
</body>
</html>
