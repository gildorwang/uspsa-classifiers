name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 13 * * *" # daily, ~6am Pacific
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      # uspsa.org's Cloudflare usually blocks GitHub runner IPs (HTTP 403); fall back to the committed site/data.json.
      - run: python scripts/build_site_data.py || echo "::warning::Scrape failed; deploying committed site/data.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
